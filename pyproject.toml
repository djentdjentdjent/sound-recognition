[project]
name = "sound-recognition"
version = "0.1.0"
description = "A web application for environmental sound classification using machine learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.5.3",
    "jupyterlab>=4.6.3",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "python-multipart>=0.0.20,<1",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
    "uvicorn>=0.34,<1",
]

[project.scripts]
sound-recognition = "sound_recognition:main"
train-baselines = "sound_recognition.experiments:main"
train-improved = "sound_recognition.improved_experiments:main"
train-model = "sound_recognition.model_training:main"
predict-sound = "sound_recognition.prediction:main"
serve-api = "sound_recognition.api:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.4.2",
    "ruff>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
